# .slalom/versioning.yml
project:
  name: "slalom-versioning"
  description: "Standards and workflows for version management, releases, and changelog maintenance."

# Versioning Logic
strategy:
  type: "Semantic Versioning (SemVer)"
  format: "X.Y.Z"
  definitions:
    X: "Major: Breaking public API changes."
    Y: "Minor: New features, non-breaking architectural shifts."
    Z: "Patch: Bug fixes, documentation updates, internal refactors."

# Workflow Mechanics
release_process:
  - "Step 1: Finalize content in [Unreleased] section of CHANGELOG.md."
  - "Step 2: Bump version in src/__init__.py."
  - "Step 3: Tag git repository with vX.Y.Z."

# Policies
directives:
  - "Single Source: src/__init__.py is the source of truth for the version string."
  - "Changelog Purity: The CHANGELOG.md is a user-facing document."

# Reference Documentation
documentation:
  files: ["CHANGELOG.md"]
  glossary:
    Unreleased: "The staging area for the next version's changelog entries."
